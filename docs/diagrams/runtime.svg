    <marker id="arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1l8 4-8 4z" fill="#A1A1AA"/>
    </marker>
  </defs>
  <path d="M17 1h838l24 24v362l-16 16H1V17z" fill="#0A0A0A" stroke="#454545"/>
  <path d="M17 1h104v3H15z" fill="#FF2E2E"/>
  <g font-family="monospace">
    <text x="32" y="39" fill="#FF5656" font-size="16" font-weight="bold">Ni / 28</text>
    <text x="127" y="39" fill="#E8E6E3" font-size="18" font-weight="bold">Runtime architecture</text>
  </g>
  <g fill="none" stroke="#A1A1AA" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M166 133v35"/>
    <path d="M166 247v35"/>
    <path d="M300 320h36"/>
    <path d="M543 320h39"/>
    <path d="M300 208h282" stroke-dasharray="4 5"/>
  </g>
  <g fill="#151515" stroke="#454545">
    <path d="M32 62h256l12 12v59H32z"/>
    <path d="M32 170h256l12 12v65H32z"/>
    <path d="M32 284h256l12 12v60H32z"/>
    <path d="M338 284h193l12 12v60H338z" stroke="#FF2E2E"/>
