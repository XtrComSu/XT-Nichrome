<svg xmlns="http://www.w3.org/2000/svg" width="880" height="404" viewBox="0 0 880 404" role="img" aria-labelledby="title desc">
  <title id="title">XT-Nichrome runtime</title>
  <desc id="desc">Clients connect over REST, optional HTTP MCP, or stdio MCP. Each server has a session manager that controls Chromium over a DevTools pipe. Chromium reaches allowed origins through the policy proxy. Ni-Cursor is an optional companion.</desc>
