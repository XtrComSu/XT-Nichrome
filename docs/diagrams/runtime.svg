    <text x="606" y="337">Fixture or approved site</text>
    <text x="606" y="223">Wayland / in-browser overlay</text>
    <text x="181" y="156">REST or MCP</text>
    <text x="181" y="269">DevTools pipe</text>
    <text x="359" y="197">Optional guidance</text>
