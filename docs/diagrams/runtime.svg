    <path d="M584 170h252l12 12v65H584z" stroke-dasharray="4 4"/>
  </g>
  <g fill="#E8E6E3" font-family="monospace" font-size="17" font-weight="bold">
    <text x="54" y="91">Client</text>
    <text x="54" y="201">Session manager</text>
    <text x="54" y="315">Chromium</text>
    <text x="360" y="315">Policy proxy</text>
    <text x="606" y="315">Permitted origins</text>
    <text x="606" y="201">Ni-Cursor</text>
  </g>
  <g fill="#A1A1AA" font-family="monospace" font-size="13">
    <text x="54" y="113">CLI / HTTP / MCP</text>
    <text x="54" y="223">Leases / tabs / snapshots</text>
