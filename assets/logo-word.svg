<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 240" role="img" aria-labelledby="title description">
  <title id="title">XT-Nichrome</title>
  <desc id="description">Alloy-white XT-Nichrome lettering with a crimson T beside a chamfered nickel tile marked Ni and 28.</desc>

  <!-- Obsidian instrument panel and inset frame -->
  <path fill="#0A0A0A" stroke="#3F3F46" stroke-width="2" d="M22 1h1061l36 36v181l-21 21H1V22z"/>
  <path fill="none" stroke="#262626" d="M26 13h1052l28 29v171l-13 13H14V26z"/>
  <path fill="#FF2E2E" d="M22 1h146l-5 5H17zM1083 1h10l26 26v10z"/>

  <!-- Nickel tile -->
  <g transform="translate(37 35)">
    <path fill="#111113" stroke="#3F3F46" stroke-width="2" d="M14 1h126l29 29v125l-14 14H30L1 140V14z"/>
    <path fill="none" stroke="#262626" d="M19 9h117l25 25v117l-10 10H34L9 136V19z"/>
    <path fill="#FF2E2E" d="M139 9h6l16 16v6z"/>

    <!-- Atomic number 28 -->
    <path fill="#FF2E2E" d="M21 23h12v8h-8v4h8v3H21v-10h8v-2h-8z"/>
    <path fill="#FF2E2E" fill-rule="evenodd" d="M37 23h12v15H37zM41 26v3h4v-3zM41 32v3h4v-3z"/>

    <!-- Ni -->
    <path fill="#E8E6E3" d="M33 51h14l36 54V51h14v76H83L47 73v54H33zM108 73h21v42h9v12h-34v-12h11V85h-7z"/>
    <path fill="#FF2E2E" d="M114 51h11l5 5v10h-16z"/>
    <path fill="#3F3F46" d="M34 144h101v2H34z"/>
    <path fill="#FF2E2E" d="M34 144h26v2H34z"/>
  </g>

  <!-- XT mark, retained from the original lockup -->
  <g transform="translate(247 57) scale(3.6)">
    <path fill="#E8E6E3" d="M2.6 6.6h5.9l2.8 5.6 2.8-5.6h5.3l-4.6 9.9 4.6 9.9h-5.3l-2.8-5.6-2.8 5.6H2.6l5.3-9.9z"/>
    <path fill="#FF2E2E" d="M20.7 6.6h8.5v4.6h-2.8v15.2h-4.1V11.2h-1.6z"/>
  </g>

  <!-- NICHROME on a shared 100-unit cap line -->
  <g transform="translate(371 81) scale(.71)" fill="#E8E6E3">
    <path d="M0 42h40v16H0z"/>
    <path transform="translate(74)" d="M0 0h15l40 70V0h15v100H55L15 30v70H0z"/>
    <path transform="translate(168)" d="M6 0h54v15H41v70h19v15H6V85h19V15H6z"/>
    <path transform="translate(258)" d="M13 0h56v15H20l-5 5v60l5 5h49v15H13L0 87V13z"/>
    <path transform="translate(351)" d="M0 0h15v42h41V0h15v100H56V57H15v43H0z"/>
    <path transform="translate(446)" fill-rule="evenodd" d="M0 0h57l13 13v33L57 59H47l25 41H54L29 59H15v41H0zM15 15v29h36l4-4V19l-4-4z"/>
    <path transform="translate(542)" fill-rule="evenodd" d="M13 0h45l13 13v74l-13 13H13L0 87V13zM20 15l-5 5v60l5 5h31l5-5V20l-5-5z"/>
    <path transform="translate(637)" d="M0 0h15l26 48L67 0h15v100H67V29L45 69h-8L15 29v71H0z"/>
    <path transform="translate(743)" d="M0 0h66v15H15v27h43v15H15v28h51v15H0z"/>
  </g>

  <!-- Engraved baseline echoes the tile chamfer -->
  <path fill="#262626" d="M256 177h683l12-12h45l-14 14h-31l-10 10H256z"/>
  <path fill="#FF2E2E" d="M256 177h110l-4 4H256z"/>
</svg>
